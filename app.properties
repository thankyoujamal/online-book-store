# Database. Each key can also be set as an environment variable, e.g. DB_PASSWORD.
db.url=jdbc:mysql://localhost:3306/online_book_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=

server.port=8080
web.root=web

# Created on first start if the database has no admin yet.
admin.name=Store Admin
admin.email=admin@bookstore.local
admin.password=Admin@1234

# Online payments: demo (built-in, no account, no real money), razorpay, or off (cash on delivery only)
payment.gateway=demo

# Only used when payment.gateway=razorpay. Test keys: dashboard.razorpay.com -> API Keys (Test Mode)
payment.razorpay.keyId=
payment.razorpay.keySecret=
